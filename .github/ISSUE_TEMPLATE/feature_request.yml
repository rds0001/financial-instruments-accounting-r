name: Feature request
description: Propose a bounded API or accounting capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the inputs, desired output, and accounting context.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Describe how the result can be independently verified.
    validations:
      required: true
